<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Article Generator</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 700px; margin: 60px auto; padding: 0 20px; color: #222; }
  h1 { font-size: 24px; margin-bottom: 4px; }
  p.sub { color: #666; margin-top: 0; }
  .row { display: flex; gap: 10px; margin: 20px 0; }
  input { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
  button { padding: 12px 22px; font-size: 16px; border: none; border-radius: 6px; background: #2563eb; color: white; cursor: pointer; }
  button:disabled { background: #9ca3af; cursor: not-allowed; }
  #output { white-space: pre-wrap; line-height: 1.6; background: #f9fafb; padding: 20px; border-radius: 8px; min-height: 60px; border: 1px solid #eee; }
  .loading { color: #666; font-style: italic; }
  .error { color: #b91c1c; }
</style>
</head>
<body>
  <h1>AI Article Generator</h1>
  <p class="sub">Enter a topic and get a 500-word AI-written article.</p>

  <div class="row">
    <input id="topic" placeholder="e.g. AI in Healthcare" />
    <button id="btn" onclick="generate()">Generate</button>
  </div>

  <div id="output"></div>

<script>
// Your n8n production webhook URL
const WEBHOOK_URL = "https://manishmax.app.n8n.cloud/webhook/generate-article";

async function generate() {
  const topic = document.getElementById("topic").value.trim();
  const output = document.getElementById("output");
  const btn = document.getElementById("btn");

  if (!topic) {
    output.innerHTML = '<span class="error">Please enter a topic.</span>';
    return;
  }

  btn.disabled = true;
  output.innerHTML = '<span class="loading">Generating your article…</span>';

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ topic })
    });

    if (!res.ok) {
      throw new Error("Request failed with status " + res.status);
    }

    const data = await res.json();
    output.innerText = data.article || "No article returned.";
  } catch (err) {
    output.innerHTML = '<span class="error">Something went wrong: ' + err.message + '</span>';
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
